[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-dashboard"
version = "0.1.0"
description = "Web dashboard for gpu-watch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "01p5" }]
dependencies = ["gpuwatchlib"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gpu-dashboard = "gpu_dashboard.server:main"

[tool.setuptools.packages.find]
where = ["src"]
