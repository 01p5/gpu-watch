[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-mcp"
version = "0.1.0"
description = "MCP stdio server exposing gpu-watch probes as tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "01p5" }]
dependencies = ["gpuwatchlib"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gpu-mcp = "gpu_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
