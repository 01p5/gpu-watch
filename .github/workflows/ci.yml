name: CI

# Same shape as slurm-mgr's CI. Two parallel jobs gated on every push
# to main + every PR:
#   - backend: matrix over Python 3.10 + 3.12. pytest + 80% coverage gate.
#   - frontend: npm ci + typecheck + production build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + coverage gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install packages (editable) + test deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            -e packages/gpuwatchlib \
            -e packages/gpu-dashboard \
            -e packages/gpu-mcp
          pip install pytest pytest-cov coverage

      - name: Run pytest with coverage (fail under 80%)
        run: |
          pytest \
            --cov=gpuwatchlib --cov=gpu_dashboard --cov=gpu_mcp \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gpu-dashboard/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/gpu-dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build SPA
        run: npm run build
